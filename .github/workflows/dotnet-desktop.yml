name: .NET Core Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Unity project layout
        shell: pwsh
        run: |
          $requiredPaths = @(
            "Assets",
            "Packages",
            "ProjectSettings",
            "ProjectSettings/ProjectVersion.txt"
          )

          foreach ($path in $requiredPaths) {
            if (-not (Test-Path $path)) {
              throw "Required Unity project path is missing: $path"
            }
          }

          Write-Host "Unity project layout found for ${{ matrix.configuration }} check."
